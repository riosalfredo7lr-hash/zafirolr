<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sistema Facturador</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f2f4f7;
    --card:#ffffff;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --danger:#dc2626;
    --danger-dark:#b91c1c;
    --success:#16a34a;
    --whatsapp:#25D366;
    --text:#1f2937;
    --muted:#6b7280;
    --border:#e5e7eb;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
    -webkit-tap-highlight-color:transparent;
  }
  header.appbar{
    background:var(--primary);
    color:#fff;
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  header.appbar h1{font-size:1.15rem;margin:0;font-weight:700;}
  header.appbar .back-btn{
    background:rgba(255,255,255,.18);
    border:none;color:#fff;padding:8px 12px;border-radius:10px;
    font-size:.95rem;cursor:pointer;
  }
  .container{max-width:760px;margin:0 auto;padding:16px;}
  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    border:1px solid var(--border);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:12px;
    padding:12px 16px;
    font-size:1rem;font-weight:600;
    cursor:pointer;
    transition:background .15s, transform .05s;
    -webkit-user-select:none;user-select:none;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary{background:#e5e7eb;color:var(--text);}
  .btn-secondary:hover{background:#d1d5db;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:var(--danger-dark);}
  .btn-success{background:var(--success);color:#fff;}
  .btn-whatsapp{background:var(--whatsapp);color:#fff;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 10px;font-size:.85rem;border-radius:10px;}
  .btn-icon{background:transparent;border:none;font-size:1.1rem;cursor:pointer;padding:6px 8px;border-radius:8px;}
  .btn-icon:hover{background:#f0f1f3;}

  input[type=text], input[type=tel], input[type=number], input[type=date], input[type=month], select, textarea{
    width:100%;
    padding:12px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:1rem;
    background:#fff;
    color:var(--text);
    margin-top:4px;
    font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--primary);outline-offset:0;}
  label{font-size:.82rem;color:var(--muted);font-weight:600;display:block;margin-top:10px;}
  .field-group{margin-bottom:4px;}

  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  .top-actions{display:flex;gap:10px;margin-bottom:14px;}
  .search-wrap{margin-bottom:14px;}

  /* Dashboard */
  .dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
  .dashboard-card{
    background:#fff;border:1px solid var(--border);border-radius:18px;
    padding:26px 12px;text-align:center;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .dashboard-card:active{transform:scale(.97);}
  .dashboard-card .icon{font-size:2.1rem;margin-bottom:8px;}
  .dashboard-card .title{font-weight:700;font-size:.92rem;line-height:1.25;}

  .view-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .view-toggle button{
    flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--border);
    background:#fff;color:var(--text);font-weight:600;font-size:.9rem;cursor:pointer;
  }
  .view-toggle button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .map-empty-note{text-align:center;color:var(--muted);font-size:.85rem;padding:10px;}
  .leaflet-popup-content{margin:10px 12px;}

  .client-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;
  }
  .client-info{flex:1;min-width:0;}
  .client-info .name{font-weight:700;font-size:1.02rem;}
  .client-info .meta{color:var(--muted);font-size:.85rem;margin-top:2px;word-break:break-word;}
  .client-info .code-badge{
    display:inline-block;background:#eff4ff;color:var(--primary);
    font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:20px;margin-bottom:3px;margin-right:4px;
  }
  .client-info .day-badge{
    display:inline-block;background:#fef3c7;color:#92400e;
    font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:20px;margin-bottom:3px;
  }
  .client-actions{display:flex;flex-direction:column;gap:6px;}
  .client-actions .btn{white-space:nowrap;}

  .empty-state{text-align:center;color:var(--muted);padding:40px 10px;}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(17,24,39,.5);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:100;
  }
  .modal-overlay.center{align-items:center;}
  .modal{
    background:#fff;width:100%;max-width:520px;
    border-radius:18px 18px 0 0;
    padding:20px;
    max-height:90vh;overflow-y:auto;
    animation:slideUp .18s ease-out;
  }
  .modal-overlay.center .modal{border-radius:18px;}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h2{margin:0 0 4px 0;font-size:1.15rem;}
  .modal-sub{color:var(--muted);font-size:.85rem;margin-bottom:6px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}

  .summary-box{
    background:#eff4ff;border:1px solid #c7d9fb;border-radius:12px;padding:12px 14px;margin-bottom:14px;
  }
  .summary-box .line{display:flex;justify-content:space-between;font-size:.9rem;padding:2px 0;}
  .summary-box .line b{font-weight:700;}
  .summary-box .tag{
    display:inline-block;background:var(--primary);color:#fff;font-size:.75rem;
    padding:2px 8px;border-radius:20px;margin-top:4px;
  }

  .product-item{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .product-info{flex:1;min-width:0;}
  .product-info .pcode{
    display:inline-block;background:#eef2ff;color:#4338ca;font-size:.72rem;font-weight:700;
    padding:1px 7px;border-radius:20px;margin-bottom:3px;margin-right:4px;
  }
  .product-info .pcat{
    display:inline-block;background:#ecfdf5;color:#047857;font-size:.72rem;font-weight:700;
    padding:1px 7px;border-radius:20px;margin-bottom:3px;
  }
  .product-info .pname{font-weight:600;}
  .product-info .pprice{color:var(--muted);font-size:.9rem;}
  .product-actions{display:flex;align-items:center;gap:6px;}

  table{width:100%;border-collapse:collapse;font-size:.88rem;}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;}
  td.num{text-align:right;white-space:nowrap;}
  .qty-control{display:flex;align-items:center;gap:6px;justify-content:center;}
  .qty-control button{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--border);
    background:#f9fafb;font-weight:700;cursor:pointer;font-size:1rem;
  }
  .qty-control span{min-width:20px;text-align:center;font-weight:600;}

  .total-bar{
    display:flex;justify-content:space-between;align-items:center;
    background:#111827;color:#fff;border-radius:14px;padding:16px 18px;margin:16px 0;
  }
  .total-bar .label{font-size:.9rem;opacity:.8;}
  .total-bar .amount{font-size:1.6rem;font-weight:800;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#111827;color:#fff;padding:12px 20px;border-radius:12px;
    font-size:.92rem;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0;transition:opacity .25s, bottom .25s;pointer-events:none;
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;bottom:36px;}

  .filters-row{display:flex;gap:10px;margin-bottom:14px;}
  .order-card{margin-bottom:12px;}
  .order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .order-head .num{font-weight:800;color:var(--primary);}
  .order-head .date{color:var(--muted);font-size:.82rem;}
  .order-detail{margin-top:8px;font-size:.85rem;color:var(--text);}
  .order-detail ul{margin:6px 0;padding-left:18px;}
  .order-total{font-weight:800;font-size:1.05rem;margin-top:8px;}
  .order-footer{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .order-footer .btn{flex:1;min-width:120px;}

  .stats-bar{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;}
  .stats-bar .stat{flex:1;min-width:120px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
  .stats-bar .stat .val{font-size:1.25rem;font-weight:800;color:var(--primary);}
  .stats-bar .stat .lbl{font-size:.75rem;color:var(--muted);}

  .nosale-item{background:#fff7ed;border:1px solid #fed7aa;}

  .chart-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin:14px 0;}
  .chart-wrap h4{margin:0 0 10px 0;font-size:.9rem;color:var(--text);}
  .ranking-title{font-size:.95rem;font-weight:700;margin:18px 0 8px 0;}

  .required-mark{color:var(--danger);}
  .error-text{color:var(--danger);font-size:.8rem;margin-top:4px;display:none;}
  .error-text.show{display:block;}

  .fab-space{height:10px;}

  @media print{
    header.appbar, .no-print, .modal-overlay{display:none !important;}
    body{background:#fff;padding:0;}
    .container{max-width:100%;padding:0;}
    .card{box-shadow:none;border:1px solid #ccc;}
    .print-only{display:block !important;}
  }
  .print-only{display:none;}
  .print-title{text-align:center;margin-bottom:12px;}

  /* Áreas de impresión especiales: Remito y Hoja de Carga */
  .remito-print-only, .hoja-print-only{display:none;}
  body.mode-remito header, body.mode-remito #mainContainer, body.mode-remito .toast{display:none !important;}
  body.mode-remito .remito-print-only{display:block !important;padding:24px;}
  body.mode-hoja header, body.mode-hoja #mainContainer, body.mode-hoja .toast{display:none !important;}
  body.mode-hoja .hoja-print-only{display:block !important;padding:24px;}

  .remito-sheet{max-width:800px;margin:0 auto;}
  .remito-header{
    display:flex;justify-content:space-between;align-items:flex-start;gap:24px;
    padding-bottom:16px;margin-bottom:16px;border-bottom:3px solid #0f3d91;
  }
  .remito-box{font-size:.9rem;line-height:1.5;}
  .remito-box .box-label{
    font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    font-weight:700;margin-bottom:4px;
  }
  .remito-box .big{font-weight:800;font-size:1.1rem;margin-bottom:2px;color:#111827;}

  .remito-brand-box{text-align:right;}
  .remito-brand-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;}
  .remito-brand-text .brand-name{font-size:1.2rem;font-weight:800;color:#0f3d91;line-height:1.2;}
  .remito-brand-text .brand-meta{font-size:.8rem;color:var(--muted);margin-top:2px;}
  .remito-logo{
    width:58px;height:58px;border-radius:50%;object-fit:cover;flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .remito-logo-fallback{
    width:58px;height:58px;border-radius:50%;background:#0f3d91;color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;flex-shrink:0;
  }
  .remito-tagline{font-size:.75rem;font-style:italic;color:var(--muted);margin-top:6px;}

  .remito-meta-line{font-size:.9rem;color:#111827;font-weight:700;margin-bottom:16px;}
  .remito-meta-line .date{font-weight:500;color:var(--muted);margin-left:8px;}

  .remito-table{width:100%;border-collapse:collapse;margin-top:4px;}
  .remito-table th, .remito-table td{border:1px solid #d8dce3;padding:8px 10px;font-size:.85rem;}
  .remito-table th{background:#0f3d91;color:#fff;text-transform:uppercase;font-size:.7rem;letter-spacing:.4px;}
  .remito-table tbody tr:nth-child(even){background:#f6f8fb;}
  .remito-table td.num{text-align:right;}
  .remito-totals{margin-top:16px;margin-left:auto;width:280px;}
  .remito-totals .line{display:flex;justify-content:space-between;padding:6px 2px;font-size:.95rem;}
  .remito-totals .line.total{
    font-weight:800;font-size:1.15rem;background:#0f3d91;color:#fff;
    border-radius:8px;padding:10px 12px;margin-top:6px;
  }
  .remito-footer-note{text-align:center;color:var(--muted);font-size:.78rem;margin-top:26px;}

  .hoja-print-only h2{text-align:center;margin-bottom:4px;}
  .hoja-print-only .hoja-sub{text-align:center;color:#555;font-size:.85rem;margin-bottom:16px;}

  @media print{
    .remito-table th, .remito-totals .line.total{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>

/* ============================================================
   IMPORTACIÓN / EXPORTACIÓN EXCEL (clientes y productos)
   ============================================================ */
function normalizeHeaderKey(k){
  return String(k).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

function getRowValue(rowMap, candidates){
  for(const c of candidates){
    if(rowMap[c] !== undefined && String(rowMap[c]).trim() !== '') return String(rowMap[c]).trim();
  }
  return '';
}

function normalizeVisitDay(val){
  if(!val) return '';
  const clean = String(val).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const found = DIAS_VISITA.find(d => d.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'') === clean);
  return found || '';
}

function parseWorkbookFile(file, callback){
  if(typeof XLSX === 'undefined'){
    callback(new Error('No se pudo cargar el lector de Excel (sin conexión a internet).'));
    return;
  }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type:'array' });
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
      callback(null, rows);
    }catch(err){
      callback(err);
    }
  };
  reader.onerror = ()=> callback(new Error('No se pudo leer el archivo.'));
  reader.readAsArrayBuffer(file);
}

function parsePriceValue(val){
  if(val === '' || val === null || val === undefined) return NaN;
  const cleaned = String(val).replace(/\./g,'').replace(',', '.').replace(/[^0-9.\-]/g,'');
  return parseFloat(cleaned);
}

function importProductsFromRows(rows){
  let products = loadProducts();
  let added = 0, updated = 0, skipped = 0;

  rows.forEach(row=>{
    const rowMap = {};
    Object.keys(row).forEach(k=>{ rowMap[normalizeHeaderKey(k)] = row[k]; });

    const code = getRowValue(rowMap, ['codigo','code','cod']);
    const name = getRowValue(rowMap, ['nombre','producto','descripcion','name']);
    const priceRaw = getRowValue(rowMap, ['precio','price']);
    const price = parsePriceValue(priceRaw);
    const category = getRowValue(rowMap, ['categoria','rubro','category']) || 'General';

    if(!code || !name || isNaN(price) || price <= 0){
      skipped++;
      return;
    }

    const idx = products.findIndex(p => (p.code||'').toLowerCase() === code.toLowerCase());
    if(idx > -1){
      products[idx] = { ...products[idx], code, name, price, category, distrib: DISTRIBUIDORAS[0] };
      updated++;
    } else {
      products.push({ id: uid(), code, name, price, category, distrib: DISTRIBUIDORAS[0] });
      added++;
    }
  });

  saveProducts(products);
  return { added, updated, skipped };
}

function importClientsFromRows(rows){
  let clients = loadClients();
  let added = 0, updated = 0, skipped = 0;

  rows.forEach(row=>{
    const rowMap = {};
    Object.keys(row).forEach(k=>{ rowMap[normalizeHeaderKey(k)] = row[k]; });

    const code = getRowValue(rowMap, ['codigo','code','cod']);
    const name = getRowValue(rowMap, ['nombre','razon social','razonsocial','cliente','name']);
    const address = getRowValue(rowMap, ['direccion','domicilio','address']);
    const phone = getRowValue(rowMap, ['telefono','tel','celular','phone']);
    const visitDay = normalizeVisitDay(getRowValue(rowMap, ['dia de visita','diadevisita','dia','visita']));
    const latRaw = getRowValue(rowMap, ['latitud','lat']);
    const lngRaw = getRowValue(rowMap, ['longitud','lng','long']);
    const lat = latRaw ? parseFloat(latRaw.replace(',','.')) : null;
    const lng = lngRaw ? parseFloat(lngRaw.replace(',','.')) : null;

    if(!code || !name){
      skipped++;
      return;
    }

    const idx = clients.findIndex(c => (c.code||'').toLowerCase() === code.toLowerCase());
    if(idx > -1){
      clients[idx] = {
        ...clients[idx], code, name,
        address: address || clients[idx].address,
        phone: phone || clients[idx].phone,
        visitDay: visitDay || clients[idx].visitDay,
        lat: (lat!=null && !isNaN(lat)) ? lat : clients[idx].lat,
        lng: (lng!=null && !isNaN(lng)) ? lng : clients[idx].lng
      };
      updated++;
    } else {
      clients.push({
        id: uid(), code, name, address, phone, visitDay,
        lat: (lat!=null && !isNaN(lat)) ? lat : null,
        lng: (lng!=null && !isNaN(lng)) ? lng : null
      });
      added++;
    }
  });

  saveClients(clients);
  return { added, updated, skipped };
}

function handleImportFile(file, kind, onDone){
  parseWorkbookFile(file, (err, rows)=>{
    if(err){
      showToast('Error al leer el archivo: ' + err.message);
      return;
    }
    if(!rows || rows.length === 0){
      showToast('El archivo no tiene filas para importar.');
      return;
    }
    const stats = kind === 'products' ? importProductsFromRows(rows) : importClientsFromRows(rows);
    let msg = `Importación: ${stats.added} nuevos, ${stats.updated} actualizados`;
    if(stats.skipped > 0) msg += `, ${stats.skipped} omitidos`;
    msg += '.';
    showToast(msg);
    if(onDone) onDone();
  });
}

function exportProductsToExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('No se pudo cargar el exportador (sin conexión a internet).');
    return;
  }
  const products = loadProducts();
  if(products.length === 0){
    showToast('No hay productos para exportar.');
    return;
  }
  const rows = products.map(p=>({ Codigo:p.code||'', Producto:p.name||'', Precio:p.price||0, Categoria:p.category||'' }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Productos');
  XLSX.writeFile(wb, 'productos_zafiro.xlsx');
}

function exportClientsToExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('No se pudo cargar el exportador (sin conexión a internet).');
    return;
  }
  const clients = loadClients();
  if(clients.length === 0){
    showToast('No hay clientes para exportar.');
    return;
  }
  const rows = clients.map(c=>({
    Codigo:c.code||'', 'Razon Social':c.name||'', Telefono:c.phone||'',
    'Dia de Visita':c.visitDay||'', Direccion:c.address||'',
    Latitud: c.lat!=null ? c.lat : '', Longitud: c.lng!=null ? c.lng : ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Clientes');
  XLSX.writeFile(wb, 'clientes_zafiro.xlsx');
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function formatMoney(n){
  n = Number(n) || 0;
  return '$' + n.toLocaleString('es-AR', {minimumFractionDigits:0, maximumFractionDigits:2});
}

function formatDateAR(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function currentMonthISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function nowTimeStr(){
  const d = new Date();
  return d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
}

function waLink(phone){
  const digits = String(phone||'').replace(/[^0-9]/g,'');
  return `https://wa.me/${digits}`;
}

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 2600);
}

/* ============================================================
   SUBVISTA: GEOLOCALIZACIÓN (mapa + cargar/importar/exportar)
   ============================================================ */
let clientMapInstance = null;
let userLocation = null; // {lat, lng} — no se persiste, solo dura la sesión

function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function drawClientMap(){
  const list = getFilteredClients();
  const withCoords = list.filter(c => typeof c.lat === 'number' && typeof c.lng === 'number' && !isNaN(c.lat) && !isNaN(c.lng));
  const withoutCoords = list.length - withCoords.length;

  const note = document.getElementById('clientMapNote');
  if(note){
    note.innerHTML = `
      ${withoutCoords > 0 ? `<div class="map-empty-note">${withoutCoords} cliente(s) sin ubicación guardada (no se muestran en el mapa).</div>` : ''}
      ${list.length === 0 ? `<div class="empty-state">No hay clientes para mostrar.</div>` : ''}
    `;
  }

  if(typeof L === 'undefined'){
    document.getElementById('clientMapEl').innerHTML = '<div class="empty-state">No se pudo cargar el mapa (sin conexión a internet).</div>';
    return;
  }

  if(clientMapInstance){
    clientMapInstance.remove();
    clientMapInstance = null;
  }

  const defaultCenter = userLocation ? [userLocation.lat, userLocation.lng] : [-29.4131, -66.8558];
  const map = L.map('clientMapEl').setView(defaultCenter, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  clientMapInstance = map;

  const bounds = [];

  if(userLocation){
    const meIcon = L.divIcon({
      className: '',
      html: '<div style="width:18px;height:18px;border-radius:50%;background:#16a34a;border:3px solid #fff;box-shadow:0 0 0 2px #16a34a;"></div>',
      iconSize: [18,18],
      iconAnchor: [9,9]
    });
    L.marker([userLocation.lat, userLocation.lng], { icon: meIcon, zIndexOffset: 1000 })
      .addTo(map)
      .bindPopup('📍 Tu ubicación actual');
    bounds.push([userLocation.lat, userLocation.lng]);
  }

  withCoords.forEach(c=>{
    const marker = L.marker([c.lat, c.lng]).addTo(map);
    let distanceLine = '';
    if(userLocation){
      const km = haversineKm(userLocation.lat, userLocation.lng, c.lat, c.lng);
      distanceLine = `<div style="font-size:.78rem;color:#2563eb;margin-bottom:8px;">📏 ~${km.toFixed(1)} km en línea recta</div>`;
    }
    const popupHtml = `
      <div style="min-width:180px;">
        <div style="font-weight:700;margin-bottom:2px;">${escapeHtml(c.name)}</div>
        <div style="font-size:.8rem;color:#555;margin-bottom:4px;">${escapeHtml(c.address || '')}</div>
        ${distanceLine}
        <div style="display:flex;gap:6px;margin-bottom:6px;">
          <button onclick="window.mapEditClient('${c.id}')" style="flex:1;padding:6px 8px;border:none;border-radius:8px;background:#e5e7eb;cursor:pointer;font-size:.78rem;">Modificar</button>
          <button onclick="window.mapOrderClient('${c.id}')" style="flex:1;padding:6px 8px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;font-size:.78rem;">Pedido</button>
        </div>
        <button onclick="window.mapDirections(${c.lat},${c.lng})" style="width:100%;padding:7px 8px;border:none;border-radius:8px;background:#16a34a;color:#fff;cursor:pointer;font-size:.78rem;font-weight:700;">🧭 Cómo llegar</button>
      </div>
    `;
    marker.bindPopup(popupHtml);
    bounds.push([c.lat, c.lng]);
  });

  if(bounds.length > 0){
    map.fitBounds(bounds, { padding:[30,30], maxZoom:15 });
  }
}

window.mapEditClient = function(id){
  const client = loadClients().find(c=>c.id===id);
  if(client) openClientModal(client);

window.mapOrderClient = function(id){

window.mapDirections = function(lat, lng){
  const url = userLocation
    ? `https://www.google.com/maps/dir/?api=1&origin=${userLocation.lat},${userLocation.lng}&destination=${lat},${lng}&travelmode=driving`
    : `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  window.open(url, '_blank');
};

/* ============================================================

function openClientModal(existingClient){
  const isEdit = !!existingClient;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const lat = isEdit && existingClient.lat!=null ? existingClient.lat : '';
  const lng = isEdit && existingClient.lng!=null ? existingClient.lng : '';
  const dayOptionsHtml = DIAS_VISITA.map(d=>{
    const selected = isEdit && existingClient.visitDay === d ? 'selected' : '';
    return `<option value="${d}" ${selected}>${d}</option>`;
  }).join('');

  overlay.innerHTML = `
    <div class="modal">
      <h2>${isEdit ? 'Modificar Cliente' : 'Cargar Cliente'}</h2>
      <div class="field-group">
        <label>Código <span class="required-mark">*</span></label>
        <input type="text" id="clientCodeInput" value="${isEdit ? escapeHtml(existingClient.code || '') : ''}" placeholder="Ej: 001">
        <div class="error-text" id="clientCodeError">El código es obligatorio.</div>
      </div>
      <div class="field-group">
        <label>Razón social <span class="required-mark">*</span></label>
        <input type="text" id="clientNameInput" value="${isEdit ? escapeHtml(existingClient.name) : ''}" placeholder="Ej: Comercial Los Ceibos">
        <div class="error-text" id="clientNameError">El nombre es obligatorio.</div>
      </div>
      <div class="field-group">
        <label>Teléfono</label>
        <input type="tel" id="clientPhoneInput" value="${isEdit ? escapeHtml(existingClient.phone) : ''}" placeholder="Ej: 3804123456">
      </div>
      <div class="field-group">
        <label>Día de visita</label>
        <select id="clientDayInput">
          <option value="">Sin día asignado</option>
          ${dayOptionsHtml}
        </select>
      </div>
      <div class="field-group">
        <label>Dirección (opcional)</label>
        <input type="text" id="clientAddressInput" value="${isEdit ? escapeHtml(existingClient.address||'') : ''}" placeholder="Ej: Av. San Martín 123">
      </div>
      <div class="field-group">
        <label>Geolocalización (opcional)</label>
        <div class="row">
          <input type="number" step="any" id="clientLatInput" value="${lat}" placeholder="Latitud">
          <input type="number" step="any" id="clientLngInput" value="${lng}" placeholder="Longitud">
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="clientGeoBtn" style="margin-top:8px;">📍 Usar mi ubicación actual</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="clientCancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="clientSaveBtn">Guardar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) document.body.removeChild(overlay); });
  document.getElementById('clientCancelBtn').addEventListener('click', ()=> document.body.removeChild(overlay));

  document.getElementById('clientGeoBtn').addEventListener('click', ()=>{
    if(!navigator.geolocation){
      showToast('Este dispositivo no soporta geolocalización.');
      return;
    }
    showToast('Obteniendo ubicación...');
    navigator.geolocation.getCurrentPosition(
      pos=>{
        document.getElementById('clientLatInput').value = pos.coords.latitude.toFixed(6);
        document.getElementById('clientLngInput').value = pos.coords.longitude.toFixed(6);
        showToast('Ubicación capturada.');
      },
      err=>{ showToast('No se pudo obtener la ubicación.'); },
      { enableHighAccuracy:true, timeout:10000 }
    );
  });

  document.getElementById('clientSaveBtn').addEventListener('click', ()=>{
    const codeInput = document.getElementById('clientCodeInput');
    const nameInput = document.getElementById('clientNameInput');
    const code = codeInput.value.trim();
    const name = nameInput.value.trim();
    const phone = document.getElementById('clientPhoneInput').value.trim();
    const visitDay = document.getElementById('clientDayInput').value;
    const address = document.getElementById('clientAddressInput').value.trim();
    const latVal = document.getElementById('clientLatInput').value.trim();
    const lngVal = document.getElementById('clientLngInput').value.trim();
    const newLat = latVal ? parseFloat(latVal) : null;
    const newLng = lngVal ? parseFloat(lngVal) : null;

    let valid = true;
    document.getElementById('clientCodeError').classList.remove('show');
    document.getElementById('clientNameError').classList.remove('show');
    if(!code){ document.getElementById('clientCodeError').classList.add('show'); valid = false; }
    if(!name){ document.getElementById('clientNameError').classList.add('show'); valid = false; }
    if(!valid) return;

    let clients = loadClients();
    if(isEdit){
      const idx = clients.findIndex(c=>c.id === existingClient.id);
      if(idx > -1){
        clients[idx] = { ...clients[idx], code, name, phone, visitDay, address, lat:newLat, lng:newLng };
      }
    } else {
      clients.push({ id: uid(), code, name, phone, visitDay, address, lat:newLat, lng:newLng });
    }
    saveClients(clients);
    document.body.removeChild(overlay);
    showToast(isEdit ? 'Cliente actualizado.' : 'Cliente guardado.');
    render();
  });
}

    if(!file) return;
    handleImportFile(file, 'products', ()=> render());
    e.target.value = '';
  });
  document.getElementById('btnExportProducts').addEventListener('click', exportProductsToExcel);

  document.getElementById('productsManageSearchInput').addEventListener('input', (e)=>{
    state.productsManageSearch = e.target.value;
    refreshProductsManageList();
  });
  document.getElementById('productCategoryFilter').addEventListener('change', (e)=>{
    state.productFilterCategory = e.target.value;
    refreshProductsManageList();
  });
  document.getElementById('productPriceMinFilter').addEventListener('input', (e)=>{

    refreshProductsManageList();
  });
  document.getElementById('productPriceMaxFilter').addEventListener('input', (e)=>{
    state.productFilterPriceMax = e.target.value;
    refreshProductsManageList();

  refreshProductsManageList();

  function refreshProductsManageList(){
    const wrap = document.getElementById('productsManageList');
    const search = state.productsManageSearch.trim().toLowerCase();
    const min = state.productFilterPriceMin !== '' ? parseFloat(state.productFilterPriceMin) : null;
    const max = state.productFilterPriceMax !== '' ? parseFloat(state.productFilterPriceMax) : null;

    let products = loadProducts().slice().sort((a,b)=> (a.code||'').localeCompare(b.code||''));
    if(search){
      products = products.filter(p => p.name.toLowerCase().includes(search) || (p.code||'').toLowerCase().includes(search));
    }
    if(state.productFilterCategory){
      products = products.filter(p => p.category === state.productFilterCategory);
    }
    if(min !== null && !isNaN(min)){
      products = products.filter(p => p.price >= min);
    }
    if(max !== null && !isNaN(max)){
      products = products.filter(p => p.price <= max);
    }

    if(products.length === 0){
      wrap.innerHTML = `<div class="empty-state">No hay productos para mostrar.</div>`;
      return;
    }
    wrap.innerHTML = products.map(p => `
      <div class="card product-item">
        <div class="product-info">
          <div><span class="pcode">${escapeHtml(p.code || '-')}</span><span class="pcat">${escapeHtml(p.category || 'General')}</span></div>
          <div class="pname">${escapeHtml(p.name)}</div>
          <div class="pprice">${formatMoney(p.price)}</div>
        </div>
        <div class="product-actions">
          <button class="btn btn-secondary btn-sm" data-edit-product="${p.id}">✏️ Modificar</button>
        </div>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-edit-product]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const product = loadProducts().find(p=>p.id === btn.dataset.editProduct);
        openProductModal(product);
      });
    });
  }
}

/* ============================================================
   MODAL: CARGAR / MODIFICAR PRODUCTO
   ============================================================ */
function openProductModal(existingProduct){
  const isEdit = !!existingProduct;
  const currentCode = isEdit ? existingProduct.code : '';
  const currentCategory = isEdit ? (existingProduct.category || '') : '';
  const categories = getProductCategories();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  overlay.innerHTML = `
    <div class="modal">
      <h2>${isEdit ? 'Modificar Producto' : 'Cargar Producto'}</h2>
      <div class="field-group">
        <label>Código <span class="required-mark">*</span></label>
        <input type="text" id="productCodeInput" value="${escapeHtml(currentCode || '')}" placeholder="Ej: 0001">
        <div class="error-text" id="productCodeError">El código es obligatorio.</div>
      </div>
      <div class="field-group">
        <label>Producto <span class="required-mark">*</span></label>
        <input type="text" id="productNameInput" value="${isEdit ? escapeHtml(existingProduct.name) : ''}" placeholder="Ej: Harina 0000 1kg">
        <div class="error-text" id="productNameError">El nombre es obligatorio.</div>
      </div>
      <div class="field-group">
        <label>Precio <span class="required-mark">*</span></label>
        <input type="number" id="productPriceInput" min="0.01" step="0.01" value="${isEdit ? existingProduct.price : ''}" placeholder="Ej: 850">
        <div class="error-text" id="productPriceError">El precio debe ser mayor que 0.</div>
      </div>
      <div class="field-group">
        <label>Categoría</label>
        <input type="text" id="productCategoryInput" list="categoryList" value="${escapeHtml(currentCategory)}" placeholder="Ej: Almacén, Bebidas...">
        <datalist id="categoryList">
          ${categories.map(c=>`<option value="${escapeHtml(c)}">`).join('')}
        </datalist>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="productCancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="productSaveBtn">Guardar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) document.body.removeChild(overlay); });
  document.getElementById('productCancelBtn').addEventListener('click', ()=> document.body.removeChild(overlay));

  document.getElementById('productSaveBtn').addEventListener('click', ()=>{
    const codeInput = document.getElementById('productCodeInput');
    const nameInput = document.getElementById('productNameInput');
    const priceInput = document.getElementById('productPriceInput');
    const categoryInput = document.getElementById('productCategoryInput');

    const code = codeInput.value.trim();
    const name = nameInput.value.trim();
    const price = parseFloat(priceInput.value);
    const category = categoryInput.value.trim() || 'General';

    let valid = true;
    document.getElementById('productCodeError').classList.remove('show');
    document.getElementById('productNameError').classList.remove('show');
    document.getElementById('productPriceError').classList.remove('show');

    if(!code){ document.getElementById('productCodeError').classList.add('show'); valid = false; }
    if(!name){ document.getElementById('productNameError').classList.add('show'); valid = false; }
    if(isNaN(price) || price <= 0){ document.getElementById('productPriceError').classList.add('show'); valid = false; }
    if(!valid) return;

    let products = loadProducts();
    if(isEdit){
      const idx = products.findIndex(p=>p.id === existingProduct.id);
      if(idx > -1){
        products[idx] = { ...products[idx], code, name, price, category, distrib: DISTRIBUIDORAS[0] };
      }
      state.cart.forEach(item=>{
        if(item.productId === existingProduct.id){
          item.code = code; item.name = name; item.price = price; item.category = category;
        }
      });
    } else {
      products.push({ id: uid(), code, name, price, category, distrib: DISTRIBUIDORAS[0] });
    }
    saveProducts(products);
    document.body.removeChild(overlay);
    showToast(isEdit ? 'Producto actualizado.' : 'Producto guardado.');

    if(state.view === 'orderScreen'){
      renderProductList();
      renderCart();
    } else if(state.view === 'products'){
      render();
    }
  });
}

/* ============================================================

function renderProductList(){
  const wrap = document.getElementById('productList');
  if(!wrap) return;
  const search = state.productSearch.trim().toLowerCase();
  const allProducts = loadProducts();

  let products;
  if(search){
    products = allProducts.filter(p =>
      p.name.toLowerCase().includes(search) || (p.code || '').toLowerCase().includes(search)
    );
  } else {
    products = allProducts.slice(0,5);
  }

  if(products.length === 0){
    wrap.innerHTML = `<div class="empty-state">No se encontraron productos.</div>`;
    return;
  }

  wrap.innerHTML = products.map(p => `
    <div class="card product-item">
      <div class="product-info">
        <div><span class="pcode">${escapeHtml(p.code || '-')}</span><span class="pcat">${escapeHtml(p.category || 'General')}</span></div>
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="pprice">${formatMoney(p.price)}</div>
      </div>
      <div class="product-actions">
        <button class="btn btn-primary btn-sm" data-add-product="${p.id}">Agregar</button>
      </div>
    </div>
  `).join('');

  wrap.querySelectorAll('[data-add-product]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      addProductToCart(btn.dataset.addProduct);
    });
  });
}

function addProductToCart(productId){
  const product = loadProducts().find(p=>p.id === productId);
  if(!product) return;
  const existing = state.cart.find(item => item.productId === productId);
  if(existing){
    existing.qty += 1;
  } else {
    state.cart.push({ productId: product.id, code: product.code, category: product.category, name: product.name, price: product.price, qty: 1 });
  }
  renderCart();
  showToast(`${product.name} agregado.`);
}

function renderCart(){
  const wrap = document.getElementById('cartTableWrap');
  const totalEl = document.getElementById('orderTotalAmount');
  if(!wrap) return;

  if(state.cart.length === 0){
    wrap.innerHTML = `<div class="empty-state">El pedido está vacío. Agregá productos del catálogo.</div>`;
    if(totalEl) totalEl.textContent = formatMoney(0);
    return;
  }

  let total = 0;
  const rows = state.cart.map((item, idx) => {
    const subtotal = item.price * item.qty;
    total += subtotal;
    return `
      <tr>
        <td>${escapeHtml(item.name)}</td>
        <td class="num">${formatMoney(item.price)}</td>
        <td>
          <div class="qty-control no-print">
            <button data-dec="${idx}">−</button>
            <span>${item.qty}</span>
            <button data-inc="${idx}">+</button>
          </div>
          <div class="print-only" style="text-align:center;">${item.qty}</div>
        </td>
        <td class="num">${formatMoney(subtotal)}</td>
        <td class="no-print"><button class="btn-icon" data-remove="${idx}" title="Eliminar">🗑️</button></td>
      </tr>
    `;
  }).join('');

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th class="num">P. Unit.</th>
          <th>Cant.</th>
          <th class="num">Subtotal</th>
          <th class="no-print"></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  wrap.querySelectorAll('[data-inc]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.cart[btn.dataset.inc].qty += 1;
      renderCart();
    });
  });
  wrap.querySelectorAll('[data-dec]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = btn.dataset.dec;
      state.cart[idx].qty -= 1;
      if(state.cart[idx].qty <= 0){
        state.cart.splice(idx,1);
      }
      renderCart();
    });
  });
  wrap.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.cart.splice(btn.dataset.remove,1);
      renderCart();
    });
  });

  if(totalEl) totalEl.textContent = formatMoney(total);
}

function getCartTotal(){
  return state.cart.reduce((sum,item)=> sum + item.price * item.qty, 0);
}

/* ============================================================
   FINALIZAR / GUARDAR PEDIDO
   ============================================================ */
function finishOrder(){
  if(state.cart.length === 0){
    showToast('⚠️ El pedido está vacío. Agregá al menos un producto.');
    return;
  }

  const clients = loadClients();
  const client = clients.find(c=>c.id === state.currentClientId);
  if(!client) return;

  const total = getCartTotal();
  let orders = loadOrders();

  const itemsSnapshot = state.cart.map(i=>({
    productId:i.productId, code:i.code, category:i.category, name:i.name, price:i.price, qty:i.qty, subtotal:i.price*i.qty
  }));

  if(state.editingOrderId){
    const idx = orders.findIndex(o=>o.id === state.editingOrderId);
    if(idx > -1){
      orders[idx] = {
        ...orders[idx],
        clientId: client.id,
        clientCode: client.code,
        clientName: client.name,
        clientPhone: client.phone,
        clientAddress: client.address,
        distrib: state.currentDistrib,
        items: itemsSnapshot,
        total
      };
    }
    saveOrders(orders);
    showToast('Pedido guardado correctamente.');
    state.editingOrderId = null;
    state.cart = [];
    state.view = 'orders';
    render();
    return;
  }

  const newOrder = {
    id: uid(),
    number: nextOrderNumber(),
    date: todayISO(),
    time: nowTimeStr(),
    clientId: client.id,
    clientCode: client.code,
    clientName: client.name,
    clientPhone: client.phone,
    clientAddress: client.address,
    distrib: state.currentDistrib,
    items: itemsSnapshot,
    total
  };
  orders.push(newOrder);
  saveOrders(orders);

  showToast('Pedido guardado correctamente.');
  state.cart = [];
  state.view = 'orders';
  render();
}

    state.ordersFilterDate = todayISO();
    document.getElementById('filterDate').value = state.ordersFilterDate;
    refreshOrdersListing();
  });
  document.getElementById('btnClearFilter').addEventListener('click', ()=>{

    document.getElementById('filterDate').value = '';

        <div class="stat"><div class="val">${formatMoney(totalAmount)}</div><div class="lbl">Monto total</div></div>
      </div>
    `;

    if(orders.length === 0){
      listWrap.innerHTML = `<div class="empty-state">No hay pedidos para mostrar.</div>`;

function openOrderForEdit(orderId){
  const order = loadOrders().find(o=>o.id===orderId);
  if(!order) return;
  const client = loadClients().find(c=>c.id === order.clientId);
  if(!client){
    alert('El cliente de este pedido ya no existe.');
    return;
  }
  state.currentClientId = order.clientId;
  state.currentDistrib = order.distrib;
  state.editingOrderId = order.id;
  state.cart = order.items.map(it => ({ productId: it.productId, code: it.code, category: it.category, name: it.name, price: it.price, qty: it.qty }));
  state.productSearch = '';
  state.view = 'orderScreen';
  render();
}

/* ============================================================
   IMPRESIÓN: HOJA DE CARGA
   ============================================================ */
function buildHojaCargaItems(orders){
  const map = {};
  orders.forEach(o=>{
    o.items.forEach(it=>{
      const key = it.productId || it.name;
      if(!map[key]){
        map[key] = { code: it.code || '-', name: it.name, qty: 0 };
      }
      map[key].qty += it.qty;
    });
  });
  return Object.values(map).sort((a,b)=> (a.code||'').localeCompare(b.code||''));
}

function printHojaCarga(){
  let orders = loadOrders();
  if(state.ordersFilterDate){
    orders = orders.filter(o=>o.date === state.ordersFilterDate);
  }
  if(orders.length === 0){
    showToast('No hay pedidos para generar la hoja de carga.');
    return;
  }

  const items = buildHojaCargaItems(orders);
  const subtitle = state.ordersFilterDate
    ? `Fecha: ${formatDateAR(state.ordersFilterDate)}`
    : `Todos los pedidos (${orders.length})`;

  const rows = items.map(it => `
    <tr>
      <td>${escapeHtml(it.code)}</td>
      <td>${escapeHtml(it.name)}</td>
      <td class="num">${it.qty}</td>
    </tr>
  `).join('');

  const html = `
    <h2>Hoja de Carga</h2>
    <div class="hoja-sub">${escapeHtml(subtitle)}</div>
    <table class="remito-table">
      <thead>
        <tr><th>Código</th><th>Descripción</th><th class="num">Cantidad</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  document.getElementById('hojaPrintArea').innerHTML = html;
  document.body.classList.add('mode-hoja');
  window.print();
}

/* ============================================================
   IMPRESIÓN: REMITO
   ============================================================ */
function printRemito(orderId){
  const order = loadOrders().find(o=>o.id === orderId);
  if(!order) return;

  let clientCode = order.clientCode;
  if(!clientCode){
    const client = loadClients().find(c=>c.id === order.clientId);
    clientCode = client ? (client.code || '-') : '-';
  }

  const rows = order.items.map(it => `
    <tr>
      <td>${escapeHtml(it.code || '-')}</td>
      <td class="num">${it.qty}</td>
      <td>${escapeHtml(it.name)}</td>
      <td class="num">${formatMoney(it.price)}</td>
      <td class="num">${formatMoney(it.subtotal)}</td>
    </tr>
  `).join('');

  const initials = EMPRESA.name.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
  const logoHtml = EMPRESA.logoDataUrl
    ? `<img src="${EMPRESA.logoDataUrl}" alt="Logo" class="remito-logo">`
    : `<div class="remito-logo-fallback">${escapeHtml(initials)}</div>`;

  const comprobanteNum = String(order.number).padStart(6,'0');

  const html = `
    <div class="remito-sheet">
      <div class="remito-header">
        <div class="remito-box">
          <div class="box-label">Cliente N° ${escapeHtml(clientCode)}</div>
          <div class="big">${escapeHtml(order.clientName)}</div>
          <div>${escapeHtml(order.clientAddress || '-')}</div>
          <div>${escapeHtml(order.clientPhone || '-')}</div>
        </div>
        <div class="remito-brand-box">
          <div class="remito-brand-row">
            <div class="remito-brand-text">
              <div class="brand-name">${escapeHtml(EMPRESA.name)}</div>
              <div class="brand-meta">${escapeHtml(EMPRESA.address)}</div>
              <div class="brand-meta">${escapeHtml(EMPRESA.phone)}</div>
            </div>
            ${logoHtml}
          </div>
          <div class="remito-tagline">Distribuidor oficial de Saphirus</div>
        </div>
      </div>

      <div class="remito-meta-line">Comprobante ${comprobanteNum}<span class="date">${formatDateAR(order.date)}</span></div>

      <table class="remito-table">
        <thead>
          <tr><th>Código</th><th>Cantidad</th><th>Descripción</th><th>P. Unitario</th><th>Precio</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="remito-totals">
        <div class="line"><span>Subtotal</span><span>${formatMoney(order.total)}</span></div>
        <div class="line total"><span>Total</span><span>${formatMoney(order.total)}</span></div>
      </div>
      <div class="remito-footer-note">Gracias por su compra — ${escapeHtml(EMPRESA.name)}</div>
    </div>
  `;

  document.getElementById('remitoPrintArea').innerHTML = html;
  document.body.classList.add('mode-remito');
  window.print();
}

window.addEventListener('afterprint', ()=>{
  document.body.classList.remove('mode-remito');
  document.body.classList.remove('mode-hoja');
});

/* ============================================================
   SECCIÓN 3: INDICADORES DE VENTA
   ============================================================ */
function computeIndicators(orders, noSales){
  const totalVentas = orders.reduce((s,o)=>s+o.total,0);
  const clientesCompraronSet = new Set(orders.map(o=>o.clientId));
  const clientesSinCompraSet = new Set(noSales.map(n=>n.clientId));
  const clientesCompraron = clientesCompraronSet.size;
  const clientesSinCompra = clientesSinCompraSet.size;
  const totalVisitados = clientesCompraron + clientesSinCompra;
  const efectividad = totalVisitados > 0 ? (clientesCompraron / totalVisitados * 100) : 0;

  const porProductoMap = {};
  const porCategoriaMap = {};
  orders.forEach(o=>{
    o.items.forEach(it=>{
      const key = it.productId || it.name;
      if(!porProductoMap[key]) porProductoMap[key] = { code: it.code||'-', name: it.name, qty:0, monto:0 };
      porProductoMap[key].qty += it.qty;
      porProductoMap[key].monto += it.subtotal;

      const cat = it.category || 'General';
      porCategoriaMap[cat] = (porCategoriaMap[cat]||0) + it.subtotal;
    });
  });

  return {
    totalVentas, clientesCompraron, clientesSinCompra, totalVisitados, efectividad,
    cantidadPedidos: orders.length,
    porProducto: Object.values(porProductoMap).sort((a,b)=>b.monto-a.monto),
    porCategoria: Object.entries(porCategoriaMap).sort((a,b)=>b[1]-a[1])
  };
}

function renderIndicatorStatsHtml(stats){
  return `
    <div class="stats-bar">
      <div class="stat"><div class="val">${formatMoney(stats.totalVentas)}</div><div class="lbl">Total vendido</div></div>
      <div class="stat"><div class="val">${stats.efectividad.toFixed(0)}%</div><div class="lbl">Efectividad</div></div>
      <div class="stat"><div class="val">${stats.clientesCompraron}</div><div class="lbl">Compraron</div></div>
      <div class="stat"><div class="val">${stats.clientesSinCompra}</div><div class="lbl">Sin compra</div></div>
      <div class="stat"><div class="val">${stats.cantidadPedidos}</div><div class="lbl">Pedidos</div></div>
    </div>
  `;
}

function renderRankingsHtml(stats){
  const productRows = stats.porProducto.length === 0
    ? `<tr><td colspan="4" style="text-align:center;color:var(--muted);">Sin ventas</td></tr>`
    : stats.porProducto.map(p=>`
        <tr>
          <td>${escapeHtml(p.code)}</td>
          <td>${escapeHtml(p.name)}</td>
          <td class="num">${p.qty}</td>
          <td class="num">${formatMoney(p.monto)}</td>
        </tr>
      `).join('');

  const catRows = stats.porCategoria.length === 0
    ? `<tr><td colspan="2" style="text-align:center;color:var(--muted);">Sin ventas</td></tr>`
    : stats.porCategoria.map(([cat,monto])=>`
        <tr><td>${escapeHtml(cat)}</td><td class="num">${formatMoney(monto)}</td></tr>
      `).join('');

  return `
    <div class="ranking-title">Venta por producto</div>
    <div class="card" style="padding:8px 10px;">
      <table>
        <thead><tr><th>Código</th><th>Producto</th><th class="num">Cant.</th><th class="num">Monto</th></tr></thead>
        <tbody>${productRows}</tbody>
      </table>
    </div>
    <div class="ranking-title">Venta por categoría</div>
    <div class="card" style="padding:8px 10px;">
      <table>
        <thead><tr><th>Categoría</th><th class="num">Monto</th></tr></thead>
        <tbody>${catRows}</tbody>
      </table>
    </div>
  `;
}

function renderIndicatorsSection(){
  setHeader('📊 Indicadores de Venta', true, ()=>{ state.view='home'; render(); });

  if(!state.indicatorsDate) state.indicatorsDate = todayISO();
  if(!state.indicatorsMonth) state.indicatorsMonth = currentMonthISO();

  mainContainer.innerHTML = `
    <div class="view-toggle">
      <button id="btnIndDaily" class="${state.indicatorsSubView==='daily'?'active':''}">📅 Diario</button>
      <button id="btnIndMonthly" class="${state.indicatorsSubView==='monthly'?'active':''}">🗓️ Mensual</button>
    </div>
    <div id="indicatorsArea"></div>
  `;

  document.getElementById('btnIndDaily').addEventListener('click', ()=>{ state.indicatorsSubView='daily'; render(); });
  document.getElementById('btnIndMonthly').addEventListener('click', ()=>{ state.indicatorsSubView='monthly'; render(); });

  if(state.indicatorsSubView === 'monthly'){
    renderIndicatorsMonthly();
  } else {
    renderIndicatorsDaily();
  }
}

function renderIndicatorsDaily(){
  const area = document.getElementById('indicatorsArea');
  area.innerHTML = `
    <div class="field-group" style="margin-bottom:14px;">
      <label style="margin-top:0;">Día a analizar</label>
      <input type="date" id="indDateInput" value="${state.indicatorsDate}">
    </div>
    <div id="indDailyContent"></div>
  `;
  document.getElementById('indDateInput').addEventListener('change',(e)=>{
    state.indicatorsDate = e.target.value || todayISO();
    refreshDaily();
  });
  refreshDaily();

  function refreshDaily(){
    const orders = loadOrders().filter(o=>o.date === state.indicatorsDate);
    const noSales = loadNoSales().filter(n=>n.date === state.indicatorsDate);
    const stats = computeIndicators(orders, noSales);
    document.getElementById('indDailyContent').innerHTML = `
      <div class="modal-sub" style="margin-bottom:6px;">${formatDateAR(state.indicatorsDate)}</div>
      ${renderIndicatorStatsHtml(stats)}
      ${renderRankingsHtml(stats)}
    `;
  }
}

let monthlyChartInstance = null;

function getDaysInMonth(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  return new Date(y,m,0).getDate();
}

function renderIndicatorsMonthly(){
  const area = document.getElementById('indicatorsArea');
  area.innerHTML = `
    <div class="field-group" style="margin-bottom:14px;">
      <label style="margin-top:0;">Mes a analizar</label>
      <input type="month" id="indMonthInput" value="${state.indicatorsMonth}">
    </div>
    <div id="indMonthlyContent"></div>
  `;
  document.getElementById('indMonthInput').addEventListener('change',(e)=>{
    state.indicatorsMonth = e.target.value || currentMonthISO();
    refreshMonthly();
  });
  refreshMonthly();

  function refreshMonthly(){
    const monthStr = state.indicatorsMonth;
    const orders = loadOrders().filter(o=>o.date.startsWith(monthStr));
    const noSales = loadNoSales().filter(n=>n.date.startsWith(monthStr));
    const stats = computeIndicators(orders, noSales);

    const daysInMonth = getDaysInMonth(monthStr);
    const dailyTotals = new Array(daysInMonth).fill(0);
    orders.forEach(o=>{
      const day = parseInt(o.date.split('-')[2],10);
      if(day>=1 && day<=daysInMonth) dailyTotals[day-1] += o.total;
    });

    document.getElementById('indMonthlyContent').innerHTML = `
      <div class="modal-sub" style="margin-bottom:6px;">Mes: ${escapeHtml(monthStr)}</div>
      ${renderIndicatorStatsHtml(stats)}
      <div class="chart-wrap">
        <h4>Venta por día del mes</h4>
        <canvas id="monthlyChart" height="180"></canvas>
      </div>
      ${renderRankingsHtml(stats)}
    `;

    if(typeof Chart !== 'undefined'){
      const ctx = document.getElementById('monthlyChart').getContext('2d');
      if(monthlyChartInstance){
        monthlyChartInstance.destroy();
        monthlyChartInstance = null;
      }
      monthlyChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: dailyTotals.map((_,i)=> String(i+1)),
          datasets: [{
            label: 'Venta ($)',
            data: dailyTotals,
            backgroundColor: '#2563eb'
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display:false } },
          scales: { y: { beginAtZero:true } }
        }
      });
    } else {
      document.getElementById('monthlyChart').outerHTML = '<div class="empty-state">No se pudo cargar el gráfico (sin conexión a internet).</div>';
    }
  }
}

seedDataIfEmpty();

render();
